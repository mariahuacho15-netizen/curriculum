<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curriculum Vitae – Formulario de envío</title>
<style>
  :root{
    --papel:#fffdf8; --fondo:#e4e0d6; --tinta:#232323; --suave:#6a665e;
    --linea:#b9b3a4; --acento:#1f4e5f; --error:#a32020;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--tinta);
       font:16px/1.5 Georgia,"Times New Roman",serif;padding:2rem 1rem}
  .hoja{max-width:820px;margin:0 auto;background:var(--papel);
        border:1px solid var(--linea);box-shadow:0 2px 14px rgba(0,0,0,.12)}
  .cabecera{display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid var(--linea)}
  .cabecera h1{flex:1;text-align:center;margin:0;padding:1.6rem 1rem;
               font-size:1.9rem;font-weight:normal;letter-spacing:.06em}
  .foto{width:130px;align-self:stretch;border-left:1px solid var(--linea);
        display:flex;align-items:center;justify-content:center;padding:.6rem}
  .foto label{width:100px;height:120px;border:2px solid var(--linea);display:flex;
        align-items:center;justify-content:center;text-align:center;cursor:pointer;
        font-size:.85rem;font-weight:bold;color:var(--suave);overflow:hidden;position:relative}
  .foto label:focus-within,.foto label:hover{border-color:var(--acento);color:var(--acento)}
  .foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .foto input{position:absolute;opacity:0;inset:0;cursor:pointer}
  form{padding:1.5rem 2rem 2rem}
  fieldset{border:0;padding:0;margin:0 0 1.8rem}
  legend{font-size:1.3rem;padding:0;width:100%;border-bottom:1px solid var(--linea);
         margin-bottom:.9rem;padding-bottom:.25rem;color:var(--acento)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem 1.4rem}
  .full{grid-column:1/-1}
  label.campo{display:block;font-size:.92rem;color:var(--suave)}
  label.campo span.req{color:var(--error)}
  input[type=text],input[type=tel],input[type=email],input[type=date],input[type=number],select,textarea{
    width:100%;margin-top:.2rem;padding:.5rem .6rem;font:inherit;color:var(--tinta);
    background:#fff;border:1px solid var(--linea);border-radius:3px}
  textarea{min-height:5.5rem;resize:vertical}
  input:focus,select:focus,textarea:focus,button:focus-visible{
    outline:3px solid #7db4c7;outline-offset:1px;border-color:var(--acento)}
  input:user-invalid,select:user-invalid{border-color:var(--error)}
  .exp{border:1px solid var(--linea);background:#faf7ef;padding:1rem;margin-bottom:.8rem;position:relative}
  .exp .grid{grid-template-columns:2fr 1fr 1fr}
  .quitar{position:absolute;top:.4rem;right:.5rem;background:none;border:0;color:var(--error);
          font-size:1rem;cursor:pointer}
  button.btn{font:inherit;padding:.6rem 1.3rem;border-radius:3px;cursor:pointer;
             border:1px solid var(--acento);background:var(--acento);color:#fff}
  button.btn:hover{background:#163b49}
  button.sec{background:transparent;color:var(--acento)}
  button.sec:hover{background:#e8f0f3}
  .check{display:flex;gap:.6rem;align-items:flex-start;font-size:.95rem}
  .check input{margin-top:.35rem}
  .acciones{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.2rem}
  .nota{font-size:.88rem;color:var(--suave)}

  /* Vista de confirmación */
  #resultado{display:none;padding:1.5rem 2rem 2rem}
  #resultado h2{font-size:1.3rem;color:var(--acento);border-bottom:1px solid var(--linea);
                padding-bottom:.25rem;margin:1.5rem 0 .6rem;font-weight:normal}
  #resultado dl{display:grid;grid-template-columns:200px 1fr;gap:.25rem 1rem;margin:0}
  #resultado dt{color:var(--suave)} #resultado dd{margin:0;white-space:pre-wrap}
  .aviso{background:#e7f1ea;border:1px solid #9cc2a6;padding:.8rem 1rem;margin-bottom:1rem}
  .exitoso form{display:none}
  .exitoso #resultado{display:block}

  @media(max-width:640px){
    .grid,.exp .grid{grid-template-columns:1fr}
    form,#resultado{padding:1.2rem}
    .cabecera h1{font-size:1.4rem}
    #resultado dl{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff;padding:0}.hoja{box-shadow:none;border:0}
    .noprint{display:none!important}
  }
</style>
</head>
<body>
<div class="hoja" id="hoja">
  <header class="cabecera">
    <h1>CURRICULUM VITAE</h1>
    <div class="foto">
      <label for="foto" id="fotoLabel"><span id="fotoTxt">FOTO</span>
        <input type="file" id="foto" name="foto" accept="image/*" form="cv" aria-label="Subir foto">
      </label>
    </div>
  </header>

  <form id="cv" action="enviacurriculo.htm" method="post" novalidate>

    <fieldset>
      <legend>Datos personales</legend>
      <div class="grid">
        <label class="campo">Apellidos <span class="req">*</span>
          <input type="text" name="apellidos" autocomplete="family-name" required></label>
        <label class="campo">Nombre <span class="req">*</span>
          <input type="text" name="nombre" autocomplete="given-name" required></label>
        <label class="campo">DNI <span class="req">*</span>
          <input type="text" name="dni" inputmode="numeric" pattern="[0-9]{8}" maxlength="8"
                 title="8 dígitos" required></label>
        <label class="campo">Fecha de nacimiento <span class="req">*</span>
          <input type="date" name="nacimiento" autocomplete="bday" required></label>
        <label class="campo">Lugar de nacimiento
          <input type="text" name="lugar"></label>
        <label class="campo">Estado civil
          <select name="estado_civil">
            <option value="">Seleccione…</option><option>Soltero(a)</option>
            <option>Casado(a)</option><option>Conviviente</option>
            <option>Divorciado(a)</option><option>Viudo(a)</option>
          </select></label>
        <label class="campo full">Dirección
          <input type="text" name="direccion" autocomplete="street-address"></label>
        <label class="campo">Localidad
          <input type="text" name="localidad" autocomplete="address-level2"></label>
        <label class="campo">Provincia
          <input type="text" name="provincia" autocomplete="address-level1"></label>
        <label class="campo">Teléfono
          <input type="tel" name="telefono" autocomplete="tel"></label>
        <label class="campo">Teléfono móvil <span class="req">*</span>
          <input type="tel" name="movil" autocomplete="tel" required></label>
        <label class="campo full">E-mail <span class="req">*</span>
          <input type="email" name="email" autocomplete="email" required></label>
        <label class="campo full">Perfil en LinkedIn o portafolio
          <input type="text" name="web" placeholder="https://"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Formación y estudios</legend>
      <div class="grid">
        <label class="campo">Titulación <span class="req">*</span>
          <input type="text" name="titulacion" required></label>
        <label class="campo">Nivel de estudios
          <select name="nivel">
            <option value="">Seleccione…</option><option>Secundaria</option>
            <option>Técnico</option><option>Universitario</option>
            <option>Maestría</option><option>Doctorado</option>
          </select></label>
        <label class="campo full">Idiomas
          <input type="text" name="idiomas" placeholder="Ej.: Inglés intermedio, Quechua nativo"></label>
        <label class="campo full">Conocimientos informáticos
          <input type="text" name="informatica" placeholder="Ej.: Excel avanzado, HTML5, Python"></label>
        <label class="campo full">Cursos y seminarios
          <textarea name="cursos"></textarea></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Experiencia profesional</legend>
      <div id="experiencias"></div>
      <button type="button" class="btn sec" id="agregarExp">+ Agregar otra experiencia</button>
    </fieldset>

    <fieldset>
      <legend>Datos complementarios</legend>
      <div class="grid">
        <label class="campo">Disponibilidad
          <select name="disponibilidad">
            <option value="">Seleccione…</option><option>Inmediata</option>
            <option>En 15 días</option><option>En 30 días</option>
          </select></label>
        <label class="campo">Pretensión salarial (S/)
          <input type="number" name="salario" min="0" step="50"></label>
        <label class="campo full">Información adicional
          <textarea name="adicional" placeholder="Logros, referencias, licencias, etc."></textarea></label>
      </div>
    </fieldset>

    <p class="nota">Todo lo expuesto anteriormente podrá ser acreditado, en caso de solicitud.</p>
    <div class="grid">
      <label class="campo">Lugar <span class="req">*</span>
        <input type="text" name="lugar_firma" required></label>
      <label class="campo">Fecha <span class="req">*</span>
        <input type="date" name="fecha_firma" id="fechaFirma" required></label>
    </div>
    <label class="check" style="margin-top:1rem">
      <input type="checkbox" name="acepto" required>
      <span>Declaro que los datos son verdaderos y autorizo su tratamiento para procesos de selección.</span>
    </label>

    <div class="acciones">
      <button type="submit" class="btn">Enviar currículum</button>
      <button type="reset" class="btn sec" id="limpiar">Limpiar formulario</button>
    </div>
  </form>

  <section id="resultado" aria-live="polite">
    <div class="aviso noprint"><strong>Currículum recibido.</strong> Revisa tus datos; puedes imprimirlos o guardarlos como PDF.</div>
    <div id="contenido"></div>
    <div class="acciones noprint">
      <button class="btn" onclick="window.print()">Imprimir / Guardar PDF</button>
      <button class="btn sec" id="volver">Editar o enviar otro</button>
    </div>
  </section>
</div>

<template id="tplExp">
  <div class="exp">
    <button type="button" class="quitar" title="Quitar esta experiencia" aria-label="Quitar experiencia">✕</button>
    <div class="grid">
      <label class="campo">Empresa <input type="text" name="empresa[]"></label>
      <label class="campo">Desde <input type="date" name="exp_desde[]"></label>
      <label class="campo">Hasta <input type="date" name="exp_hasta[]"></label>
      <label class="campo full">Puesto / actividad desarrollada
        <textarea name="puesto[]"></textarea></label>
    </div>
  </div>
</template>

<script>
(function () {
  const form = document.getElementById('cv');
  const hoja = document.getElementById('hoja');
  const cont = document.getElementById('experiencias');
  const tpl  = document.getElementById('tplExp');
  const fotoInput = document.getElementById('foto');
  const fotoLabel = document.getElementById('fotoLabel');
  let fotoURL = '';

  document.getElementById('fechaFirma').valueAsDate = new Date();

  function agregarExp() {
    cont.appendChild(tpl.content.cloneNode(true));
  }
  agregarExp();
  document.getElementById('agregarExp').addEventListener('click', agregarExp);
  cont.addEventListener('click', e => {
    if (e.target.classList.contains('quitar') && cont.children.length > 1) {
      e.target.closest('.exp').remove();
    }
  });

  fotoInput.addEventListener('change', () => {
    const f = fotoInput.files[0];
    fotoLabel.querySelector('img')?.remove();
    fotoURL = '';
    document.getElementById('fotoTxt').style.display = '';
    if (!f) return;
    fotoURL = URL.createObjectURL(f);
    const img = new Image(); img.src = fotoURL; img.alt = 'Foto del postulante';
    fotoLabel.appendChild(img);
    document.getElementById('fotoTxt').style.display = 'none';
  });

  document.getElementById('limpiar').addEventListener('click', () => {
    setTimeout(() => {
      fotoLabel.querySelector('img')?.remove();
      document.getElementById('fotoTxt').style.display = '';
      cont.innerHTML = ''; agregarExp();
      document.getElementById('fechaFirma').valueAsDate = new Date();
    });
  });

  // Construye la vista con textContent (evita inyección de HTML)
  function seccion(parent, titulo, pares) {
    const h = document.createElement('h2'); h.textContent = titulo; parent.appendChild(h);
    const dl = document.createElement('dl');
    pares.filter(p => p[1]).forEach(([k, v]) => {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    });
    parent.appendChild(dl);
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const d = new FormData(form);
    const g = n => (d.get(n) || '').toString().trim();
    const out = document.getElementById('contenido'); out.innerHTML = '';

    if (fotoURL) {
      const img = new Image(); img.src = fotoURL; img.alt = 'Foto';
      img.style.cssText = 'width:110px;height:130px;object-fit:cover;border:1px solid #b9b3a4;float:right;margin-left:1rem';
      out.appendChild(img);
    }
    seccion(out, 'Datos personales', [
      ['Apellidos y nombre', g('apellidos') + ', ' + g('nombre')], ['DNI', g('dni')],
      ['Fecha de nacimiento', g('nacimiento')], ['Lugar', g('lugar')],
      ['Estado civil', g('estado_civil')], ['Dirección', g('direccion')],
      ['Localidad', g('localidad')], ['Provincia', g('provincia')],
      ['Teléfono', g('telefono')], ['Teléfono móvil', g('movil')],
      ['E-mail', g('email')], ['Web / LinkedIn', g('web')]]);
    seccion(out, 'Formación y estudios', [
      ['Titulación', g('titulacion')], ['Nivel', g('nivel')], ['Idiomas', g('idiomas')],
      ['Conocimientos informáticos', g('informatica')], ['Cursos y seminarios', g('cursos')]]);

    const emp = d.getAll('empresa[]'), desde = d.getAll('exp_desde[]'),
          hasta = d.getAll('exp_hasta[]'), puesto = d.getAll('puesto[]');
    emp.forEach((x, i) => {
      if (!x.trim() && !puesto[i].trim()) return;
      seccion(out, 'Experiencia profesional' + (emp.length > 1 ? ' (' + (i + 1) + ')' : ''), [
        ['Empresa', x], ['Fecha', [desde[i], hasta[i]].filter(Boolean).join(' a ')],
        ['Puesto / actividad', puesto[i]]]);
    });
    seccion(out, 'Datos complementarios', [
      ['Disponibilidad', g('disponibilidad')],
      ['Pretensión salarial', g('salario') ? 'S/ ' + g('salario') : ''],
      ['Información adicional', g('adicional')]]);
    const p = document.createElement('p'); p.style.marginTop = '1.5rem';
    p.textContent = 'Todo lo expuesto anteriormente podrá ser acreditado, en caso de solicitud. ' +
                    g('lugar_firma') + ', ' + g('fecha_firma');
    out.appendChild(p);

    hoja.classList.add('exitoso'); window.scrollTo({ top: 0 });
  });

  document.getElementById('volver').addEventListener('click', () => {
    hoja.classList.remove('exitoso'); window.scrollTo({ top: 0 });
  });
})();
</script>
</body>
</html>
